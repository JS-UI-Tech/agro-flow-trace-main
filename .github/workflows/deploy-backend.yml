name: Deploy Backend (Coolify / aerocruz)

on:
  push:
    branches: ["main"]
    paths:
      - "api/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit || true

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Deployment
        id: deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEPLOYMENT_ID=$(echo '{"ref":"'"${GITHUB_SHA}"'","environment":"production","required_contexts":[],"auto_merge":false}' \
            | gh api -X POST repos/${GITHUB_REPOSITORY}/deployments --input - -q '.id')
          echo "id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"

      - name: Trigger Coolify deployment
        run: |
          curl -sf -X POST \
            "https://devops.jsui.digital/api/v1/deploy?uuid=${{ secrets.COOLIFY_APP_UUID }}&force=false" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_KEY }}" \
            -H "Content-Type: application/json"

      - name: Mark deployment success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST repos/${GITHUB_REPOSITORY}/deployments/${{ steps.deployment.outputs.id }}/statuses \
            -f state=success -f environment_url=https://agro-trace.jsui.digital \
            -f description="Coolify deploy triggered"

      - name: Mark deployment failure
        if: failure() && steps.deployment.outputs.id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST repos/${GITHUB_REPOSITORY}/deployments/${{ steps.deployment.outputs.id }}/statuses \
            -f state=failure -f description="Coolify deploy trigger failed"
